[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Rutas del backend
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# Todo lo demás (guías, chatbot, widget) se sirve por proxy desde el sitio estático
[[redirects]]
  from = "/*"
  to = "https://tangerine-khapse-1f7965.netlify.app/:splat"
  status = 200
  force = false
